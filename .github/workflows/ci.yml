name: CI

# Only main and pull requests; throwaway and worker branches never run.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Only a superseded pull_request run is cancelled. A push to main always finishes, so a
# cancelled conclusion is never read as a failed main check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # tsc reads no Swift and no SDK, so the typechecks run once, on Linux, next to the unit
  # shards instead of ahead of them on every macOS runner (LKM-327).
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      # package.json version is SemVer and CHANGELOG.md has an Unreleased section (LKM-143).
      - name: Version and changelog
        run: bun scripts/check-version.mjs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: |
          bun run typecheck
          bun run typecheck:native

  unit:
    # A pull request splits the unit tier over 3 runners; a push to main runs it whole
    # on one (docs/TESTING.md "GitHub CI"). Every shard computes the same split from the
    # selection and test/tiers.mjs alone (shardTests in test/helpers/test-plan.mjs).
    name: unit tests (${{ matrix.shard }}/${{ strategy.job-total }})
    # The Swift service owners compile against the macOS 26 SDK (scripts/requirements.mjs
    # MIN_SDK). The macos-26 image's default Xcode 26 provides it; the toolchain step
    # fails the job if it does not. See docs/TESTING.md "GitHub CI".
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event_name == 'pull_request' && '[1, 2, 3]' || '[1]') }}
    steps:
      # Full history: a pull request's selection diffs against the merge base with the
      # event's base commit (docs/TESTING.md "Changed-file selection").
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      - name: Toolchain
        run: |
          xcode-select -p
          xcrun swiftc --version
          git --version
          bun scripts/requirements.mjs --build

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Compiled Swift test fixtures, the shared Clang module cache and the last test
      # times (test/helpers/swift-build.mjs, LKM-167). Binaries are keyed by toolchain,
      # flags and source contents, so a stale cache only costs a rebuild. A shard first
      # restores its own last cache, then main's whole-tier one, then any.
      - name: Restore Swift test cache
        id: swift-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .local/test-cache
            .local/test-times.json
          key: unit-swift-${{ runner.os }}-${{ matrix.shard }}of${{ strategy.job-total }}-${{ github.sha }}
          restore-keys: |
            unit-swift-${{ runner.os }}-${{ matrix.shard }}of${{ strategy.job-total }}-
            unit-swift-${{ runner.os }}-1of1-
            unit-swift-${{ runner.os }}-

      - name: Swift test cache result
        env:
          HIT: ${{ steps.swift-cache.outputs.cache-hit }}
          MATCHED: ${{ steps.swift-cache.outputs.cache-matched-key }}
        run: |
          echo "exact hit: ${HIT:-false}; restored: ${MATCHED:-nothing (cold cache)}"
          du -sh .local/test-cache 2>/dev/null || true

      # --report prints the 20 slowest. --log-tail prints the last 150 lines of every
      # failing test's log into the job output; the full logs are in the artifact below.
      # A push to main runs every unit test. A pull request runs the plan for its diff
      # against the event's base commit (--changed): docs, test-only and audited UI
      # changes run their tests and readers, anything else runs everything, and a
      # selection error fails the step. --shard then runs this runner's part of it.
      - name: Unit tests
        env:
          TREZI_TEST_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          TREZI_TEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          if [ -n "$TREZI_TEST_BASE" ]; then set -- --changed="$TREZI_TEST_BASE"; fi
          node test/run.mjs unit --report --timeout-ms=120000 --log-tail=150 --shard="$TREZI_TEST_SHARD" "$@"

      # A failed run saves too (a cancelled one does not), so its compiled fixtures are
      # not built again on the next push.
      - name: Save Swift test cache
        if: ${{ !cancelled() && steps.swift-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            .local/test-cache
            .local/test-times.json
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}

      # always(): upload after a green, red or cancelled run alike, so the logs of a
      # failing (or flaky) test can be downloaded for 7 days.
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-logs-${{ matrix.shard }}of${{ strategy.job-total }}
          path: test/artifacts/runs/
          retention-days: 7

  # The one check for the typecheck and every unit shard, under the name the job had
  # before the split.
  test:
    name: typecheck + unit tests
    needs: [typecheck, unit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Typecheck and every unit shard passed
        env:
          TYPECHECK: ${{ needs.typecheck.result }}
          UNIT: ${{ needs.unit.result }}
        run: |
          echo "typecheck: $TYPECHECK; unit shards: $UNIT"
          test "$TYPECHECK" = success && test "$UNIT" = success

  app-build:
    name: app build
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      # Full history: the build stamps the commit count of HEAD as the build number and
      # test/versioning.mjs compares the built plist with it (scripts/version.mjs).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      # Pull requests only: a docs or test-only plan needs no app. The job and its check
      # still run and report; a push to main, a product change or any fallback builds.
      # A selection error fails the job.
      - name: Selection
        id: plan
        if: github.event_name == 'pull_request'
        env:
          TREZI_TEST_BASE: ${{ github.event.pull_request.base.sha }}
        run: node test/select.mjs --base="$TREZI_TEST_BASE" --github-output
      - name: Toolchain
        if: steps.plan.outputs.app_build != 'false'
        run: bun scripts/requirements.mjs --build
      - name: Install dependencies
        if: steps.plan.outputs.app_build != 'false'
        run: bun install --frozen-lockfile
      - name: Build ad hoc signed distribution
        if: steps.plan.outputs.app_build != 'false'
        run: TREZI_SIGN_IDENTITY=- bun run build
      - name: Check assembled app, service and resources
        if: steps.plan.outputs.app_build != 'false'
        run: |
          test -s out/native/Trezi.app/Contents/MacOS/TreziHost
          test -s out/native/Trezi.app/Contents/Helpers/bun
          test -s out/native/Trezi.app/Contents/Helpers/TreziSecrets
          test -s out/native/Trezi.app/Contents/XPCServices/dev.trezi.service.xpc/Contents/MacOS/TreziService
          test -s out/native/Trezi.app/Contents/Resources/backend/index.cjs
          test -s out/native/Trezi.app/Contents/Resources/backend/provider-helper.cjs
          test -s out/native/Trezi.app/Contents/Resources/backend/syntax/shiki.mjs
          test -s out/native/Trezi.app/Contents/Resources/Trezi.icns
          bun test/distribution.mjs
          bun test/versioning.mjs
          codesign --verify --deep --strict out/native/Trezi.app

  dependency-audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout with PR base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - name: Audit the Bun lockfile against the PR base
        env:
          TREZI_AUDIT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun scripts/dependency-audit.mjs

  # No native GUI or live provider tier here: the runner has no desktop session to
  # drive and no provider credentials. Run them on a Mac: node test/run.mjs native|live.
