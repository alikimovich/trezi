    <!-- Distinct siblings — each <li> its own JSX literal (src/Layers.tsx:7-9).

      <li id="li-alpha" data-trezi-source="src/Layers.tsx:7:6">Alpha</li>

    <!-- A .map()-rendered list — every instance shares the IDENTICAL stamp
         (src/Layers.tsx:18:8), since there's only one <li> literal in source.
         Dragging between these must fall back to the chat agent. The extra
         `s-…` class is a compiler style-scope marker (what Svelte-style scoped
         CSS stamps onto every element): the tree must not show it. -->
    <ul id="mapped-list" data-trezi-source="src/Layers.tsx:16:4">
      <li class="mapped s-p0FWuf5vgUnM" data-trezi-source="src/Layers.tsx:18:8">One</li>
